<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wolfy Weapon Battles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA 1: LOGIN -->
    <div id="login-screen" class="screen active">
        <h1>🐺 Wolfy Weapon Battles</h1>
        <p>Bienvenido al claro del bosque.</p>
        <input type="text" id="username-input" placeholder="Elige tu nombre de lobo...">
        <button onclick="createAccount()">Crear Cuenta / Entrar</button>
    </div>

    <!-- PANTALLA 2: MENÚ DE SERVIDORES -->
    <div id="server-menu" class="screen hidden">
        <h2>Hola, <span id="display-name"></span></h2>
        <div class="menu-options">
            <button onclick="joinRandomServer()" class="btn-primary">🎲 Juego Random</button>
            <button onclick="createPrivateRoom()" class="btn-secondary">🏠 Crear Sala Privada</button>
            
            <div class="join-code-section">
                <input type="text" id="room-code-input" placeholder="Código de sala">
                <button onclick="joinWithCode()">Unirse por Código</button>
            </div>
        </div>
        <p id="status-msg"></p>
    </div>

    <!-- PANTALLA 3: JUEGO (Placeholder) -->
    <div id="game-screen" class="screen hidden">
        <h1>¡Estás en la batalla!</h1>
        <p>Servidor: <span id="current-server-id"></span></p>
        <button onclick="leaveGame()">Salir al Menú</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
